name: Build Orca Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Orca git ref to build
        required: true
        default: fork/mobile-live-alerts-android-0.0.69
      artifact_name:
        description: Artifact name
        required: true
        default: orca-mobile-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone Orca build branch
        env:
          ORCA_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$ORCA_REF" https://github.com/Astroisback/orca.git orca

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        run: npm install --global pnpm@12.14.0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: orca/mobile
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: orca/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        working-directory: orca/mobile
        run: cd android && ./gradlew assembleRelease

      - name: Checksum APK
        working-directory: orca/mobile
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apk="${apks[0]}"
          bytes="$(wc -c < "$apk" | tr -d ' ')"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          printf '%s *%s\n' "$sha256" "$(basename "$apk")" > "$apk.sha256"
          echo "APK is $bytes bytes, sha256 $sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            orca/mobile/android/app/build/outputs/apk/release/*.apk
            orca/mobile/android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
